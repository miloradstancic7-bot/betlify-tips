name: Update tips

on:
  schedule:
    # Every 3 hours: new tips for the next matches, results for finished ones
    - cron: '17 */3 * * *'
  workflow_dispatch:
  # Also run when the generator itself changes
  push:
    branches: [main]
    paths:
      - generate.ps1
      - .github/workflows/update-tips.yml

permissions:
  contents: write

concurrency:
  group: update-tips
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate tips
        shell: pwsh
        run: ./generate.ps1

      - name: Commit tips.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tips.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update tips $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
